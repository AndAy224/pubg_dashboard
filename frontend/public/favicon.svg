<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The After Action tile: olive-black ground, hairline border, and the
       one PUBG object everyone recognises — the pan — in gold. -->
  <rect x="1" y="1" width="62" height="62" rx="10" fill="#0d0f0a" stroke="#3d422e" stroke-width="2"/>
  <!-- handle, drawn first so the pan sits on top of its joint -->
  <line x1="36" y1="30" x2="51" y2="15" stroke="#f0b429" stroke-width="9" stroke-linecap="round"/>
  <!-- the pan -->
  <circle cx="27" cy="39" r="14.5" fill="#f0b429"/>
  <circle cx="27" cy="39" r="9" fill="#c9920e"/>
</svg>
